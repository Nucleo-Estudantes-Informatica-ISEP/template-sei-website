name: CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, format & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Update and enable Corepack
        run: |
          npm install --global corepack@0.34.5
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build
